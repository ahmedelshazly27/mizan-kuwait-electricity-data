# Disagreements between printed values, found by `kwelec validate`. Every one stays
# open until the owner decides; until then the dataset publishes all the values with
# their provenance and marks the key as in conflict. Nothing is averaged or chosen.
# A conflict that appears in a run but is not listed here fails the validation.
groups:
  A: 'MEW 2021 edition: the capacity table''s Total column is shifted by a year in some rows (e.g. 2019 prints 18,793, which is 2018''s total; the station columns are unshifted and sum to the other editions''
    totals). Checked on the PDF text layer and bounding boxes.'
  B: CSB Environment Statistics plant capacities for 2020–2022 repeat older MEW values (Sabiya 6,746.7, Az-Zour South 5,805.8, Az-Zour North 1,540 MW) while MEW's own books for those years print the newer
    capacities.
  C: CSB monthly workbooks (summed in the sheet) and MEW's yearbook history tables differ slightly for the same plant-year or national total (generally under 0.3%). CSB cites MEW as its source.
  D: MEW 2020 edition prints national generation for 2020 as 74,756.3 (history table) and * 74,757 (energy table), and the monthly table sums to 74,756,807 MWh; the later editions print 74,757.
