# Half-hourly system load on the day of the yearly peak (extract/mew_load.py). The peak
# is this edition's printed peak for 2023 (capacity/load history table).
peak_day_curve:
  page: 76
  date: 2023-08-02
  title_printed: "Yearly Peak Load) on 2nd Of August 2023"
  peak_printed: "16940"

# Loads of the supply areas at the yearly peak, 2021-2023 (extract/mew_load.py). Rows are
# numbered as printed (1 = generating stations' own use). Area names are Arabic in a font
# whose text layer is unusable; they are not stored here (see the toolkit's zone mapping).
regional_peak:
  page: 86
  rows: 37
  value_columns_before: 62
  peak_days: [2023-08-02, 2022-08-09, 2021-07-28]

