[project]
name = "kwelec"
version = "0.1.0"
description = "Kuwait Electricity Open Dataset: pipeline from primary MEW and CSB publications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "requests==2.32.3",
  "pyyaml==6.0.2",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.4",
  "pyarrow==21.0.0",
]

[project.scripts]
kwelec = "kwelec.cli:main"

[dependency-groups]
dev = ["pytest==8.3.3", "ruff==0.6.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwelec"]

[tool.ruff]
line-length = 110
